# Test-only Postgres for the env-gated integration tier.
#
#   docker compose -f docker-compose.test.yml up -d --wait
#   TEST_DATABASE_URL=postgresql+psycopg2://nlsql:nlsql@localhost:5433/nlsql_test \
#     pytest tests/integration/test_postgres.py -v
#   docker compose -f docker-compose.test.yml down
#
# Port 5433 avoids colliding with any local development Postgres on 5432.
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: nlsql
      POSTGRES_PASSWORD: nlsql
      POSTGRES_DB: nlsql_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nlsql"]
      interval: 3s
      timeout: 3s
      retries: 20

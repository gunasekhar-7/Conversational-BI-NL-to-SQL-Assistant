# Gates, mirroring what a release needs: lint, the offline suite, the
# real-Postgres tier, the Redis shared-bucket tier, a container build, and
# (manual only) the real-LLM smoke — pushes never spend money.
# The postgres/redis jobs run their env-gated files as standalone pytest
# invocations, so a silently-skipped tier (zero selected tests = exit 5)
# fails the pipeline instead of passing green (plan Review Focus #5).
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.10
      - run: ruff check .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/unit tests/integration --ignore=tests/integration/test_postgres.py -q

  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nlsql
          POSTGRES_PASSWORD: nlsql
          POSTGRES_DB: nlsql_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nlsql"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest -m postgres -v
        env:
          TEST_DATABASE_URL: postgresql+psycopg2://nlsql:nlsql@localhost:5432/nlsql_test

  redis:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/integration/test_redis_rate_limit.py -v
        env:
          TEST_REDIS_URL: redis://127.0.0.1:6379/0

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t nl-to-sql:ci .

  llm-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    env:
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      RUN_LLM_SMOKE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - run: pytest tests/integration/test_llm_smoke.py -v
        if: env.GROQ_API_KEY != ''
